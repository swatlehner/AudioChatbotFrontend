
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Lehner Maschinenbau Betriebsanleitungs Assistent</title>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 35px auto;
      padding: 16px;
      color: #222;
    }

    h1 { text-align: center; }

    button, textarea { font: inherit; }

    button {
      cursor: pointer;
      padding: 10px 18px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    #status {
      text-align: center;
      color: #666;
      min-height: 24px;
    }

    #messages {
      height: 340px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    .message {
      max-width: 82%;
      width: fit-content;
      padding: 11px 14px;
      margin: 10px 0;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .assistant {
      background: #e9edf3;
      margin-right: auto;
    }

    .user {
      background: #d6e7ff;
      margin-left: auto;
    }

    .message small {
      display: block;
      color: #666;
      margin-bottom: 5px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    #composer {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 14px;
    }

    #textInput {
      flex: 1;
      min-width: 0;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #sendButton {
      background: #2768cc;
      color: white;
      border: none;
      border-radius: 8px;
    }

    #talkButton {
      display: block;
      width: 150px;
      height: 150px;
      margin: 26px auto 10px;
      border: none;
      border-radius: 50%;
      background: #2768cc;
      color: white;
      font-size: 18px;
      font-weight: bold;
      touch-action: none;
      user-select: none;
    }

    #talkButton.active {
      background: #c0392b;
    }

    .hint {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    kbd {
      border: 1px solid #ccc;
      background: #f3f3f3;
      padding: 3px 7px;
      border-radius: 5px;
    }


    .product-selector {
      background: #f6f7f9;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
    }

    .product-selector summary {
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .product-selector[open] summary {
      margin-bottom: 12px;
    }

    .product-selector label {
      display: block;
      font-size: 14px;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    .product-selector select {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
      font: inherit;
    }

    .product-selector select:disabled {
      opacity: 0.55;
    }

    #productStatus {
      font-size: 13px;
      color: #666;
      margin-bottom: 0;
    }
    .message.product-greeting {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    .product-greeting-content {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }

    .product-greeting-content .message-text {
      min-width: 0;
    }

    .product-greeting-image {
      display: block;
      align-self: center;
      flex: none;
      width: 50%;
      height: auto;
      max-height: 200px;
      object-fit: contain;
      background: white;
      border-radius: 8px;
    }

    #productDocuments {
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #f6f7f9;
    }

    #productDocuments summary {
      cursor: pointer;
      font-weight: bold;
    }

    #productDocumentsStatus {
      margin: 12px 0;
      color: #666;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #productDocumentsList {
      margin: 0;
      padding-left: 20px;
    }

    #productDocumentsList li {
      margin: 10px 0;
    }

    #productDocumentsList a {
      color: #2768cc;
      overflow-wrap: anywhere;
    }

  </style>
</head>

<body>
  <h1>Lehner Maschinenbau Betriebsanleitungs Assistent</h1>

  <div class="controls">
    <span>Lehner Maschinenbau Betriebsanleitungs Assistent</span>

    <label>
      <input
        id="voiceToggle"
        type="checkbox"
        disabled
      >
      Spoken replies
    </label>
  </div>

  <p id="status">Connecting...</p>


  <details id="productSelector" class="product-selector" open>
    <summary id="productSelectorSummary">Select a product</summary>

    <label for="areaSelect">Area</label>
    <select id="areaSelect" disabled>
      <option value="">Choose area...</option>
    </select>

    <label for="machineSelect">Machine</label>
    <select id="machineSelect" disabled>
      <option value="">Choose machine...</option>
    </select>

    <label for="variantSelect">Variant</label>
    <select id="variantSelect" disabled>
      <option value="">Choose variant...</option>
    </select>

    <p id="productStatus">No product selected</p>
  </details>


  <button id="retryButton" hidden>
    Retry connection
  </button>

  <div id="messages"
       role="log"
       aria-label="Conversation"
       aria-live="polite"></div>

  <form id="composer">
    <textarea
      id="textInput"
      rows="2"
      placeholder="Type a message..."
      disabled
    ></textarea>

    <button id="sendButton" type="submit" disabled>
      Send
    </button>
  </form>

  <button id="talkButton" disabled>
    Hold to talk
  </button>

  <p class="hint">
    Hold <kbd>Space</kbd> or the button to speak
  </p>

  <div id="audio"></div>

  <details id="productDocuments" hidden>
    <summary>Manuals and documents</summary>

    <p id="productDocumentsStatus" role="status"></p>

    <ul id="productDocumentsList"></ul>
  </details>

  <script>
    // Keep your existing real Railway domain here.
    const BACKEND_URL =
      "https://lehnerchatbotv03audio-production.up.railway.app";

    const $ = (id) => document.getElementById(id);

    const status = $("status");
    const retryButton = $("retryButton");
    const talkButton = $("talkButton");
    const voiceToggle = $("voiceToggle");
    const composer = $("composer");
    const textInput = $("textInput");
    const sendButton = $("sendButton");
    const messages = $("messages");
    const conversationFeedback = $("conversationFeedback");
    const thumbsUp = $("thumbsUp");
    const thumbsDown = $("thumbsDown");
    const feedbackStatus = $("feedbackStatus");
    const audioContainer = $("audio");
    const areaSelect = $("areaSelect");
    const machineSelect = $("machineSelect");
    const variantSelect = $("variantSelect");
    const productStatus = $("productStatus");
    const productSelector = $("productSelector");
    const productSelectorSummary = $("productSelectorSummary");
    const productDocuments = $("productDocuments");
    const productDocumentsStatus = $("productDocumentsStatus");
    const productDocumentsList = $("productDocumentsList");

    let documentRequest = 0;

    let room = null;
    let pointerId = null;
    let spaceHeld = false;
    let recording = false;
    let micReady = false;
    let turnQueue = Promise.resolve();

    let manualTree = null;
    let productPending = 0;
    let productError = "";
    let productQueue = Promise.resolve();
    let conversationReady = false;
    let selectionRevision = 0;

    const transcriptSegments = new Map();
    let feedbackReady = false;
    let feedbackValue = null;
    let feedbackBusy = false;
    let feedbackWatchRoom = null;

    function resetFeedback() {
      feedbackReady = false;
      feedbackValue = null;
      feedbackBusy = false;
      feedbackWatchRoom = null;

      feedbackStatus.textContent = "";
      conversationFeedback.hidden = true;
      thumbsUp.disabled = true;
      thumbsDown.disabled = true;
      thumbsUp.setAttribute("aria-pressed", "false");
      thumbsDown.setAttribute("aria-pressed", "false");
    }

    async function waitForSavedQuestion() {
      if (feedbackReady || !conversationReady || !room) return;

      const activeRoom = room;
      const revision = selectionRevision;

      if (feedbackWatchRoom === activeRoom) return;
      feedbackWatchRoom = activeRoom;

      const isCurrent = () =>
        room === activeRoom &&
        revision === selectionRevision &&
        conversationReady;

      try {
        for (
          let attempt = 0;
          attempt < 10 && isCurrent();
          attempt++
        ) {
          try {
            const result = JSON.parse(
              await callAgent("feedback_state")
            );

            if (!isCurrent()) return;

            if (result.has_questions) {
              feedbackReady = true;
              feedbackValue = result.feedback;
              feedbackStatus.textContent = "";
              updateAvailability();
              return;
            }
          } catch (error) {
            if (!isCurrent()) return;
          }

          await new Promise(
            resolve => setTimeout(resolve, 1000)
          );
        }

        if (isCurrent()) {
          feedbackStatus.textContent =
            "Feedback is temporarily unavailable. " +
            "Send another message to retry.";
        }
      } finally {
        if (feedbackWatchRoom === activeRoom) {
          feedbackWatchRoom = null;
        }
      }
    }

    async function submitFeedback(rating) {
      if (
        !feedbackReady ||
        feedbackBusy ||
        !conversationReady
      ) return;

      const activeRoom = room;
      const revision = selectionRevision;

      const isCurrent = () =>
        room === activeRoom &&
        revision === selectionRevision &&
        conversationReady;

      feedbackBusy = true;
      feedbackStatus.textContent = "Saving feedback...";
      updateAvailability();

      try {
        const result = JSON.parse(
          await callAgent(
            "set_feedback",
            JSON.stringify({ feedback: rating })
          )
        );

        if (!isCurrent()) return;

        feedbackValue = result.feedback;
        feedbackStatus.textContent =
          "Feedback saved for this conversation.";

      } catch (error) {
        if (isCurrent()) {
          feedbackStatus.textContent =
            "Feedback could not be confirmed. " +
            "Please click again to retry.";
        }

      } finally {
        if (isCurrent()) {
          feedbackBusy = false;
          updateAvailability();
        }
      }
    }

    thumbsUp.addEventListener(
      "click",
      () => submitFeedback(1)
    );

    thumbsDown.addEventListener(
      "click",
      () => submitFeedback(-1)
    );


    // Fill a dropdown with folder names.
    function populateSelect(select, values, placeholder) {
      select.replaceChildren(
        new Option(placeholder, "")
      );

      for (const value of values) {
        select.add(new Option(value, value));
      }
    }


    // Load the three-level folder tree from Railway.
    async function loadManuals() {
      try {
        const response = await fetch(
          BACKEND_URL + "/manuals"
        );

        if (!response.ok) {
          throw new Error("Cannot load product list");
        }

        manualTree = await response.json();

        populateSelect(
          areaSelect,
          Object.keys(manualTree),
          "Choose area..."
        );

        updateAvailability();

      } catch (error) {
        console.error(error);
        productStatus.textContent =
          "Product list unavailable: " + error.message;
      }
    }

    function clearProductDocuments() {
      // Invalidate any earlier request still loading.
      documentRequest++;

      productDocuments.hidden = true;
      productDocuments.open = false;
      productDocumentsStatus.textContent = "";
      productDocumentsList.replaceChildren();
    }

    async function loadProductDocuments(selection) {
      clearProductDocuments();

      if (!selection) return;

      const request = documentRequest;

      productDocuments.hidden = false;
      productDocumentsStatus.textContent = "Loading documents...";

      try {
        const parameters = new URLSearchParams({
          area: selection.area,
          machine: selection.machine,
          variant: selection.variant,
        });

        const response = await fetch(
          BACKEND_URL + "/product-documents?" +
          parameters.toString()
        );

        if (!response.ok) {
          throw new Error("Could not load document list");
        }

        const files = await response.json();

        // Ignore results belonging to a previous product.
        if (request !== documentRequest) return;

        for (const file of files) {
          const fileParameters = new URLSearchParams({
            area: selection.area,
            machine: selection.machine,
            variant: selection.variant,
            filename: file.name,
          });

          const link = document.createElement("a");

          link.textContent = `${file.name} (${file.type})`;
          link.href =
            BACKEND_URL + "/product-document?" +
            fileParameters.toString();

          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const item = document.createElement("li");
          item.appendChild(link);
          productDocumentsList.appendChild(item);
        }

        productDocumentsStatus.textContent = files.length
          ? `${selection.machine} / ${selection.variant} — opens in a new tab.`
          : "No PDF or TXT documents available for this product.";

      } catch (error) {
        if (request !== documentRequest) return;

        console.error("Document list failed:", error);

        productDocumentsList.replaceChildren();
        productDocumentsStatus.textContent =
          "Documents could not be loaded. Please select the product again.";
      }
    }
    // Every complete selection starts a separate room and conversation.
    function queueProductSelection() {
      resetFeedback();
      const revision = ++selectionRevision;
      clearProductDocuments();

      const area = areaSelect.value;
      const machine = machineSelect.value;
      const variant = variantSelect.value;

      const selection = area && machine && variant
        ? { area, machine, variant }
        : null;

      conversationReady = false;
      transcriptSegments.clear();
      messages.replaceChildren();
      textInput.value = "";

      // Silence any buffered audio immediately.
      audioContainer.querySelectorAll("audio").forEach(el => {
        el.muted = true;
      });

      pointerId = null;
      spaceHeld = false;
      stopTalk(true);

      productPending++;
      productError = "";
      updateAvailability();

      productQueue = productQueue
        .catch(() => {})
        .then(async () => {
          await turnQueue;

          if (revision !== selectionRevision) return;

          const previousRoom = room;
          room = null;
          micReady = false;
          audioContainer.replaceChildren();

          if (previousRoom) {
            await previousRoom.disconnect();
          }

          if (revision !== selectionRevision) return;

          if (!selection) {
            productStatus.textContent = "No product selected";
            status.textContent =
              "Choose an area, machine, and variant";
            return;
          }

          productStatus.textContent = "Loading product...";
          await connect(selection, revision);
        })
        .catch(error => {
          if (revision !== selectionRevision) return;

          console.error("Product selection failed:", error);
          productError = error.message;
          productStatus.textContent =
            "Could not load product: " + error.message;
          retryButton.hidden = false;
        })
        .finally(() => {
          productPending--;
          updateAvailability();
        });
    }


    // AREA CHANGED
    areaSelect.addEventListener("change", () => {
      const machines = manualTree[areaSelect.value] || {};

      populateSelect(
        machineSelect,
        Object.keys(machines),
        "Choose machine..."
      );

      populateSelect(
        variantSelect,
        [],
        "Choose variant..."
      );

      queueProductSelection();
    });


    // MACHINE CHANGED
    machineSelect.addEventListener("change", () => {
      const variants =
        manualTree[areaSelect.value]?.[machineSelect.value]
        || [];

      populateSelect(
        variantSelect,
        variants,
        "Choose variant..."
      );

      queueProductSelection();
    });


    // VARIANT CHANGED
    variantSelect.addEventListener("change", () => {
      queueProductSelection();
    });


    function getAgentIdentity() {
      if (!room) return null;

      for (const participant of room.remoteParticipants.values()) {
        if (participant.isAgent) {
          return participant.identity;
        }
      }

      return null;
    }


    function updateAvailability() {
      const agentReady = !!getAgentIdentity();

      const canChat =
        agentReady &&
        conversationReady &&
        productPending === 0 &&
        !productError;

      textInput.disabled = !canChat;
      sendButton.disabled = !canChat;
      talkButton.disabled = !canChat;
      voiceToggle.disabled = !canChat;

      conversationFeedback.hidden = !conversationReady;

      const canRate =
        canChat && feedbackReady && !feedbackBusy;

      thumbsUp.disabled = !canRate;
      thumbsDown.disabled = !canRate;

      thumbsUp.setAttribute(
        "aria-pressed",
        String(feedbackValue === 1)
      );

      thumbsDown.setAttribute(
        "aria-pressed",
        String(feedbackValue === -1)
      );

      areaSelect.disabled = !manualTree;

      machineSelect.disabled =
        !manualTree || !areaSelect.value;

      variantSelect.disabled =
        !manualTree || !machineSelect.value;

      if (recording) return;

      if (productPending > 0) {
        status.textContent = "Updating product...";
      } else if (productError) {
        status.textContent = "Product selection failed";
      } else if (room && !agentReady) {
        status.textContent = "Waiting for agent...";
      } else if (canChat) {
        status.textContent = "Connected — ready";
      } else {
        status.textContent =
          "Choose an area, machine, and variant";
      }
    }


    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "message " + role;

      const label = document.createElement("small");
      label.textContent =
        role === "user" ? "You" : "Assistant";

      const content = document.createElement("div");
      content.className = "message-text";
      content.textContent = text;

      bubble.append(label, content);
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;

      return content;
    }

    function addProductGreeting(text, selection) {
      const content = addMessage("assistant", text);

      // The initial greeting has no selected product or image.
      if (!selection) return;

      const bubble = content.parentElement;
      const image = new Image();

      image.className = "product-greeting-image";
      image.alt =
        `${selection.machine}, variant ${selection.variant}`;

      image.decoding = "async";

      image.onload = () => {
        // The user may have switched products while it was loading.
        if (!bubble.isConnected) return;

        const layout = document.createElement("div");
        layout.className = "product-greeting-content";

        content.replaceWith(layout);
        layout.append(content, image);

        bubble.classList.add("product-greeting");
      };

      const parameters = new URLSearchParams({
        area: selection.area,
        machine: selection.machine,
        variant: selection.variant,
      });

      image.src =
        BACKEND_URL + "/product-image?" + parameters.toString();
    }

    async function callAgent(method, payload = "") {
      const identity = getAgentIdentity();

      if (!identity || !room) {
        throw new Error("Agent not connected");
      }

      return room.localParticipant.performRpc({
        destinationIdentity: identity,
        method,
        payload,
      });
    }

    // Serialize PTT operations to handle quick key presses.
    function queueAction(action) {
      turnQueue = turnQueue.then(action).catch(async (error) => {
        console.error(error);
        status.textContent = "Error: " + error.message;
        recording = false;

        if (room) {
          await room.localParticipant
            .setMicrophoneEnabled(false)
            .catch(console.error);

          await callAgent("cancel_turn")
            .catch(console.error);
        }
      });
    }

    function resetControls() {
      resetFeedback();
      room = null;
      clearProductDocuments();

      productSelector.open = true;
      productSelectorSummary.textContent = "Select a product";

      conversationReady = false;
      transcriptSegments.clear();
      messages.replaceChildren();
      textInput.value = "";
      areaSelect.value = "";

      populateSelect(
        machineSelect,
        [],
        "Choose machine..."
      );

      populateSelect(
        variantSelect,
        [],
        "Choose variant..."
      );

      areaSelect.disabled = true;
      machineSelect.disabled = true;
      variantSelect.disabled = true;

      productStatus.textContent = "No product selected";

      pointerId = null;
      spaceHeld = false;
      recording = false;
      micReady = false;

      talkButton.classList.remove("active");
      talkButton.disabled = true;

      voiceToggle.checked = false;
      voiceToggle.disabled = true;

      textInput.disabled = true;
      sendButton.disabled = true;

      audioContainer.innerHTML = "";
      status.textContent = "Disconnected";
    }

    // CONNECT AUTOMATICALLY
    async function connect(
      selection = null,
      revision = selectionRevision
    ) {
      retryButton.hidden = true;
      status.textContent = "Connecting...";

      const newRoom = new LivekitClient.Room({
        disconnectOnPageLeave: true
      });

      room = newRoom;
      resetFeedback();
      conversationReady = false;
      transcriptSegments.clear();
      messages.replaceChildren();

      // Receive text only from the current conversation.
      newRoom.registerTextStreamHandler(
        "lk.transcription",
        async (reader, participantInfo) => {
          const acceptsStream = () =>
            room === newRoom &&
            revision === selectionRevision &&
            conversationReady;

          const accepted = acceptsStream();
          const attrs = reader.info.attributes || {};

          const role =
            participantInfo.identity ===
            newRoom.localParticipant.identity
              ? "user"
              : "assistant";

          const key =
            participantInfo.identity + ":" +
            (attrs["lk.segment_id"] || reader.info.id);

          let content = transcriptSegments.get(key);
          let accumulated = "";

          try {
            for await (const chunk of reader) {
              accumulated += chunk;

              if (
                !accepted ||
                !acceptsStream() ||
                !accumulated.trim()
              ) continue;

              if (!content) {
                content = addMessage(role, accumulated);
                if (role === "user") {
                  void waitForSavedQuestion();
                }

                transcriptSegments.set(key, content);
              } else {
                content.textContent = accumulated;
              }

              messages.scrollTop = messages.scrollHeight;
            }

            if (
              role === "assistant" &&
              accepted &&
              acceptsStream() &&
              !recording
            ) {
              status.textContent = "Connected — ready";
            }

          } catch (error) {
            console.error("Transcription error", error);
          }
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.TrackSubscribed,
        (track) => {
          if (track.kind === LivekitClient.Track.Kind.Audio) {
            track.setPlayoutDelay(0.2);

            if (
              room !== newRoom ||
              revision !== selectionRevision
            ) return;

            const element = track.attach();
            element.muted =
              !voiceToggle.checked || !conversationReady;

            audioContainer.appendChild(element);
          }
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.TrackUnsubscribed,
        (track) => {
          track.detach().forEach(el => el.remove());
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.ParticipantConnected,
        () => {
          if (room === newRoom) updateAvailability();
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.ParticipantDisconnected,
        () => {
          if (room === newRoom) updateAvailability();
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.Disconnected,
        () => {
          if (
            room !== newRoom ||
            revision !== selectionRevision
          ) return;

          resetControls();
          retryButton.hidden = false;
          status.textContent = "Connection closed";
        }
      );

      try {
        const response = await fetch(BACKEND_URL + "/token");

        if (!response.ok) {
          throw new Error("Could not get room token");
        }

        const data = await response.json();

        if (revision !== selectionRevision) {
          if (room === newRoom) room = null;
          await newRoom.disconnect();
          return;
        }

        await newRoom.connect(
          data.server_url,
          data.participant_token
        );

        // Wait for the agent and its RPC handlers.
        const deadline = Date.now() + 45000;
        let result;

        while (true) {
          if (
            room !== newRoom ||
            revision !== selectionRevision
          ) {
            if (room === newRoom) room = null;
            await newRoom.disconnect();
            return;
          }

          const identity = getAgentIdentity();

          if (identity) {
            try {
              result = await newRoom.localParticipant.performRpc({
                destinationIdentity: identity,
                method: "set_product",
                payload: JSON.stringify(
                  selection || { clear: true }
                ),
                responseTimeout: 60000,
              });
              break;

            } catch (error) {
              // Agent may appear before its handlers are registered.
              // 1400: unsupported method; 1503: recipient disconnected.
              const retryable = [1400, 1503].includes(error.code);

              if (!retryable || Date.now() >= deadline) {
                throw error;
              }
            }

          } else if (Date.now() >= deadline) {
            throw new Error(
              "Agent did not become ready. Please retry."
            );
          }

          await new Promise(resolve => setTimeout(resolve, 250));
        }

        if (revision !== selectionRevision) {
          if (room === newRoom) room = null;
          await newRoom.disconnect();
          return;
        }

        // Preserve the user's audio preference across products.
        await callAgent(
          "set_voice_replies",
          voiceToggle.checked ? "true" : "false"
        );

        if (revision !== selectionRevision) {
          if (room === newRoom) room = null;
          await newRoom.disconnect();
          return;
        }

        const { greeting } = JSON.parse(result);
        addProductGreeting(greeting, selection);

        conversationReady = !!selection;

        audioContainer.querySelectorAll("audio").forEach(el => {
          el.muted =
            !voiceToggle.checked || !conversationReady;
        });

        productStatus.textContent = selection
          ? `Active product: ${selection.area} / ${selection.machine} / ${selection.variant}`
          : "No product selected";

        productSelectorSummary.textContent = selection
          ? `${selection.machine} / ${selection.variant} — change product`
          : "Select a product";

        productSelector.open = !selection;

        retryButton.hidden = true;
        updateAvailability();
        void loadProductDocuments(selection);

      } catch (error) {
        console.error(error);

        if (room === newRoom) {
          room = null;
          audioContainer.replaceChildren();
        }

        await newRoom.disconnect().catch(console.error);

        if (revision !== selectionRevision) return;

        conversationReady = false;
        productError = error.message;

        productStatus.textContent =
          "Could not initialize conversation: " + error.message;

        retryButton.hidden = false;
        updateAvailability();
      }
    }

    // TEXT INPUT
    composer.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = textInput.value.trim();

      if (
        !room ||
        !getAgentIdentity() ||
        !text ||
        !conversationReady ||
        productPending > 0 ||
        productError
      ) return;

      if (pointerId !== null || spaceHeld || recording) return;

      const sendingRoom = room;
      const sendingRevision = selectionRevision;

      sendButton.disabled = true;

      try {
        await sendingRoom.localParticipant.sendText(text, {
          topic: "lk.chat",
        });

        if (
          room !== sendingRoom ||
          sendingRevision !== selectionRevision
        ) return;

        addMessage("user", text);
        void waitForSavedQuestion();

        textInput.value = "";
        status.textContent = "Processing...";

      } catch (error) {
        console.error(error);

        if (
          room === sendingRoom &&
          sendingRevision === selectionRevision
        ) {
          status.textContent = "Error: " + error.message;
        }

      } finally {
        updateAvailability();
      }
    });

    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    // VOICE OUTPUT TOGGLE
    voiceToggle.addEventListener("change", async () => {
      const voiceRoom = room;
      const revision = selectionRevision;
      const enabled = voiceToggle.checked;

      if (!voiceRoom || !conversationReady) return;

      const stillCurrent = () =>
        room === voiceRoom &&
        revision === selectionRevision;

      voiceToggle.disabled = true;

      audioContainer.querySelectorAll("audio").forEach(el => {
        el.muted = !enabled;
      });

      try {
        if (enabled) {
          await voiceRoom.startAudio();
        }

        if (!stillCurrent()) return;

        await callAgent(
          "set_voice_replies",
          enabled ? "true" : "false"
        );

      } catch (error) {
        console.error(error);

        if (!stillCurrent()) return;

        voiceToggle.checked = !enabled;

        audioContainer.querySelectorAll("audio").forEach(el => {
          el.muted = enabled;
        });

        status.textContent = "Could not change voice setting";

      } finally {
        if (stillCurrent()) {
          updateAvailability();
        }
      }
    });

    // SHARED PUSH-TO-TALK FUNCTIONS
    function startTalk() {
      talkButton.classList.add("active");

      queueAction(async () => {
        if (
          !room ||
          !conversationReady ||
          productPending > 0 ||
          productError
        ) return;

        // Request mic access only when first needed.
        if (!micReady) {
          status.textContent = "Allow microphone access...";

          await room.localParticipant
            .setMicrophoneEnabled(true);

          await room.localParticipant
            .setMicrophoneEnabled(false);

          micReady = true;
        }

        await callAgent("start_turn");

        await room.localParticipant
          .setMicrophoneEnabled(true);

        recording = true;
        status.textContent = "Listening...";
      });
    }

    function stopTalk(canceled = false) {
      talkButton.classList.remove("active");

      queueAction(async () => {
        if (!room || !recording) return;

        await room.localParticipant
          .setMicrophoneEnabled(false);

        recording = false;

        await callAgent(
          canceled ? "cancel_turn" : "end_turn"
        );

        status.textContent = canceled
          ? "Recording canceled"
          : "Processing...";
      });
    }

    // MOUSE / TOUCH
    talkButton.addEventListener("pointerdown", (event) => {
      if (
        talkButton.disabled ||
        pointerId !== null ||
        spaceHeld
      ) return;

      event.preventDefault();
      pointerId = event.pointerId;

      talkButton.setPointerCapture(pointerId);
      startTalk();
    });

    function releasePointer(event, canceled = false) {
      if (event.pointerId !== pointerId) return;

      pointerId = null;
      stopTalk(canceled);
    }

    talkButton.addEventListener(
      "pointerup",
      event => releasePointer(event)
    );

    talkButton.addEventListener(
      "pointercancel",
      event => releasePointer(event, true)
    );

    // SPACEBAR
    document.addEventListener("keydown", (event) => {
      if (event.code !== "Space") return;

      const target = event.target;

      // Space should type normally inside text fields.
      if (
        target.isContentEditable ||
        target.matches("input, textarea, select") ||
        (target.matches("button") && target !== talkButton)
      ) return;

      if (
        talkButton.disabled ||
        pointerId !== null
      ) return;

      event.preventDefault();

      if (spaceHeld || event.repeat) return;

      spaceHeld = true;
      startTalk();
    });

    document.addEventListener("keyup", (event) => {
      if (event.code !== "Space" || !spaceHeld) return;

      event.preventDefault();
      spaceHeld = false;
      stopTalk();
    });

    window.addEventListener("blur", () => {
      if (pointerId !== null) {
        pointerId = null;
        stopTalk(true);
      }

      if (spaceHeld) {
        spaceHeld = false;
        stopTalk(true);
      }
    });

    // RETRY ONLY IF CONNECTION FAILED
    retryButton.onclick = () => {
      if (
        areaSelect.value &&
        machineSelect.value &&
        variantSelect.value
      ) {
        queueProductSelection();
      } else {
        productError = "";
        void connect();
      }
    };

    // LOAD PRODUCTS AND CONNECT AUTOMATICALLY
    void loadManuals();
    void connect();
  </script>
</body>
</html>
