
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Bavarian Voice Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 35px auto;
      padding: 16px;
      color: #222;
    }

    h1 { text-align: center; }

    button, textarea { font: inherit; }

    button {
      cursor: pointer;
      padding: 10px 18px;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    #status {
      text-align: center;
      color: #666;
      min-height: 24px;
    }

    #messages {
      height: 340px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
    }

    .message {
      max-width: 82%;
      width: fit-content;
      padding: 11px 14px;
      margin: 10px 0;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .assistant {
      background: #e9edf3;
      margin-right: auto;
    }

    .user {
      background: #d6e7ff;
      margin-left: auto;
    }

    .message small {
      display: block;
      color: #666;
      margin-bottom: 5px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    #composer {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin-top: 14px;
    }

    #textInput {
      flex: 1;
      min-width: 0;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    #sendButton {
      background: #2768cc;
      color: white;
      border: none;
      border-radius: 8px;
    }

    #talkButton {
      display: block;
      width: 150px;
      height: 150px;
      margin: 26px auto 10px;
      border: none;
      border-radius: 50%;
      background: #2768cc;
      color: white;
      font-size: 18px;
      font-weight: bold;
      touch-action: none;
      user-select: none;
    }

    #talkButton.active {
      background: #c0392b;
    }

    .hint {
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    kbd {
      border: 1px solid #ccc;
      background: #f3f3f3;
      padding: 3px 7px;
      border-radius: 5px;
    }
  </style>
</head>

<body>
  <h1>Bavarian Voice Assistant</h1>

  <div class="controls">
    <div>
      <button id="connectButton">Connect</button>
      <button id="disconnectButton" disabled>
        Disconnect
      </button>
    </div>

    <label>
      <input id="voiceToggle"
             type="checkbox" disabled>
      Spoken replies
    </label>
  </div>

  <p id="status">Disconnected</p>

  <div id="messages"
       role="log"
       aria-label="Conversation"
       aria-live="polite"></div>

  <form id="composer">
    <textarea
      id="textInput"
      rows="2"
      placeholder="Type a message..."
      disabled
    ></textarea>

    <button id="sendButton" type="submit" disabled>
      Send
    </button>
  </form>

  <button id="talkButton" disabled>
    Hold to talk
  </button>

  <p class="hint">
    Hold <kbd>Space</kbd> or the button to speak
  </p>

  <div id="audio"></div>

  <script>
    // Keep your existing real Railway domain here.
    const BACKEND_URL =
      "https://lehnerchatbotv03audio-production.up.railway.app";

    const $ = (id) => document.getElementById(id);

    const status = $("status");
    const connectButton = $("connectButton");
    const disconnectButton = $("disconnectButton");
    const talkButton = $("talkButton");
    const voiceToggle = $("voiceToggle");
    const composer = $("composer");
    const textInput = $("textInput");
    const sendButton = $("sendButton");
    const messages = $("messages");
    const audioContainer = $("audio");

    let room = null;
    let pointerId = null;
    let spaceHeld = false;
    let recording = false;
    let micReady = false;
    let turnQueue = Promise.resolve();

    const transcriptSegments = new Map();

    function getAgentIdentity() {
      if (!room) return null;

      for (const participant of room.remoteParticipants.values()) {
        if (participant.isAgent) {
          return participant.identity;
        }
      }

      return null;
    }

    function updateAvailability() {
      const connected = !!room;
      const agentReady = !!getAgentIdentity();

      textInput.disabled = !agentReady;
      sendButton.disabled = !agentReady;
      talkButton.disabled = !agentReady;
      voiceToggle.disabled = !agentReady;

      if (connected && !recording) {
        status.textContent = agentReady
          ? "Connected — ready"
          : "Waiting for agent...";
      }
    }

    function addMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "message " + role;

      const label = document.createElement("small");
      label.textContent =
        role === "user" ? "You" : "Assistant";

      const content = document.createElement("div");
      content.className = "message-text";
      content.textContent = text;

      bubble.append(label, content);
      messages.appendChild(bubble);
      messages.scrollTop = messages.scrollHeight;

      return content;
    }

    async function callAgent(method, payload = "") {
      const identity = getAgentIdentity();

      if (!identity || !room) {
        throw new Error("Agent not connected");
      }

      return room.localParticipant.performRpc({
        destinationIdentity: identity,
        method,
        payload,
      });
    }

    // Serialize PTT operations to handle quick key presses.
    function queueAction(action) {
      turnQueue = turnQueue.then(action).catch(async (error) => {
        console.error(error);
        status.textContent = "Error: " + error.message;
        recording = false;

        if (room) {
          await room.localParticipant
            .setMicrophoneEnabled(false)
            .catch(console.error);

          await callAgent("cancel_turn")
            .catch(console.error);
        }
      });
    }

    function resetControls() {
      room = null;
      pointerId = null;
      spaceHeld = false;
      recording = false;
      micReady = false;

      talkButton.classList.remove("active");
      talkButton.disabled = true;
      voiceToggle.disabled = true;
      textInput.disabled = true;
      sendButton.disabled = true;

      connectButton.disabled = false;
      disconnectButton.disabled = true;
      audioContainer.innerHTML = "";
      status.textContent = "Disconnected";
    }

    // CONNECT
    connectButton.onclick = async () => {
      connectButton.disabled = true;
      status.textContent = "Connecting...";

      const newRoom = new LivekitClient.Room();

      // Receive voice transcriptions and assistant text.
      // Ignore interim segments to avoid duplicate bubbles.
      newRoom.registerTextStreamHandler(
        "lk.transcription",
        async (reader, participantInfo) => {
          const attrs = reader.info.attributes || {};

          if (attrs["lk.transcription_final"] === "false") {
            return;
          }

          const role =
            participantInfo.identity ===
            newRoom.localParticipant.identity
              ? "user"
              : "assistant";

          const key =
            participantInfo.identity + ":" +
            (attrs["lk.segment_id"] || reader.info.id);

          let content = transcriptSegments.get(key);
          let accumulated = "";

          try {
            for await (const chunk of reader) {
              accumulated += chunk;

              if (!content && accumulated.trim()) {
                content = addMessage(role, accumulated);
                transcriptSegments.set(key, content);
              }

              if (content) {
                content.textContent = accumulated;
                messages.scrollTop = messages.scrollHeight;
              }
            }
            if (
              role === "assistant" &&
              room === newRoom &&
              !recording
            ) {
              status.textContent = "Connected — ready";
            }
            
          } catch (error) {
            console.error("Transcription error", error);
          }
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.TrackSubscribed,
        (track) => {
          if (track.kind === LivekitClient.Track.Kind.Audio) {
            audioContainer.appendChild(track.attach());
          }
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.TrackUnsubscribed,
        (track) => {
          track.detach().forEach(el => el.remove());
        }
      );

      newRoom.on(
        LivekitClient.RoomEvent.ParticipantConnected,
        updateAvailability
      );

      newRoom.on(
        LivekitClient.RoomEvent.ParticipantDisconnected,
        updateAvailability
      );

      newRoom.on(
        LivekitClient.RoomEvent.Disconnected,
        resetControls
      );

      try {
        // Existing public GET /token endpoint.
        const response = await fetch(
          BACKEND_URL + "/token"
        );

        if (!response.ok) {
          throw new Error("Could not get room token");
        }

        const data = await response.json();

        await newRoom.connect(
          data.server_url,
          data.participant_token
        );

        room = newRoom;

        // Enable browser speaker playback.
        await room.startAudio();

        disconnectButton.disabled = false;
        transcriptSegments.clear();
        messages.innerHTML = "";
        updateAvailability();

      } catch (error) {
        console.error(error);
        await newRoom.disconnect().catch(console.error);
        resetControls();
        status.textContent = "Error: " + error.message;
      }
    };

    // TEXT INPUT
    composer.addEventListener("submit", async (event) => {
      event.preventDefault();

      const text = textInput.value.trim();

      if (!room || !getAgentIdentity() || !text) return;

      if (pointerId !== null || spaceHeld || recording) {
        return;
      }

      sendButton.disabled = true;

      try {
        // AgentSession handles lk.chat automatically.
        await room.localParticipant.sendText(text, {
          topic: "lk.chat",
        });

        addMessage("user", text);
        textInput.value = "";
        status.textContent = "Processing...";

      } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;
      } finally {
        sendButton.disabled = !getAgentIdentity();
      }
    });

    textInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    // VOICE OUTPUT TOGGLE
    voiceToggle.addEventListener("change", async () => {
      const enabled = voiceToggle.checked;
      voiceToggle.disabled = true;

      try {
        await callAgent(
          "set_voice_replies",
          enabled ? "true" : "false"
        );
      } catch (error) {
        console.error(error);
        voiceToggle.checked = !enabled;
        status.textContent = "Could not change voice setting";
      } finally {
        voiceToggle.disabled = !getAgentIdentity();
      }
    });

    // SHARED PUSH-TO-TALK FUNCTIONS
    function startTalk() {
      talkButton.classList.add("active");

      queueAction(async () => {
        if (!room) return;

        // Request mic access only when first needed.
        if (!micReady) {
          status.textContent = "Allow microphone access...";

          await room.localParticipant
            .setMicrophoneEnabled(true);

          await room.localParticipant
            .setMicrophoneEnabled(false);

          micReady = true;
        }

        await callAgent("start_turn");

        await room.localParticipant
          .setMicrophoneEnabled(true);

        recording = true;
        status.textContent = "Listening...";
      });
    }

    function stopTalk(canceled = false) {
      talkButton.classList.remove("active");

      queueAction(async () => {
        if (!room || !recording) return;

        await room.localParticipant
          .setMicrophoneEnabled(false);

        recording = false;

        await callAgent(
          canceled ? "cancel_turn" : "end_turn"
        );

        status.textContent = canceled
          ? "Recording canceled"
          : "Processing...";
      });
    }

    // MOUSE / TOUCH
    talkButton.addEventListener("pointerdown", (event) => {
      if (
        talkButton.disabled ||
        pointerId !== null ||
        spaceHeld
      ) return;

      event.preventDefault();
      pointerId = event.pointerId;

      talkButton.setPointerCapture(pointerId);
      startTalk();
    });

    function releasePointer(event, canceled = false) {
      if (event.pointerId !== pointerId) return;

      pointerId = null;
      stopTalk(canceled);
    }

    talkButton.addEventListener(
      "pointerup",
      event => releasePointer(event)
    );

    talkButton.addEventListener(
      "pointercancel",
      event => releasePointer(event, true)
    );

    // SPACEBAR
    document.addEventListener("keydown", (event) => {
      if (event.code !== "Space") return;

      const target = event.target;

      // Space should type normally inside text fields.
      if (
        target.isContentEditable ||
        target.matches("input, textarea, select") ||
        (target.matches("button") && target !== talkButton)
      ) return;

      if (
        talkButton.disabled ||
        pointerId !== null
      ) return;

      event.preventDefault();

      if (spaceHeld || event.repeat) return;

      spaceHeld = true;
      startTalk();
    });

    document.addEventListener("keyup", (event) => {
      if (event.code !== "Space" || !spaceHeld) return;

      event.preventDefault();
      spaceHeld = false;
      stopTalk();
    });

    window.addEventListener("blur", () => {
      if (pointerId !== null) {
        pointerId = null;
        stopTalk(true);
      }

      if (spaceHeld) {
        spaceHeld = false;
        stopTalk(true);
      }
    });

    // DISCONNECT
    disconnectButton.onclick = async () => {
      disconnectButton.disabled = true;
      talkButton.disabled = true;

      if (pointerId !== null || spaceHeld) {
        pointerId = null;
        spaceHeld = false;
        stopTalk(true);
      }

      await turnQueue;

      if (room) {
        await room.disconnect();
      }

      resetControls();
    };
  </script>
</body>
</html>
