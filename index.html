
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Bavarian Voice Assistant</title>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 60px auto;
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 12px 24px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #talkButton {
      display: block;
      width: 200px;
      height: 200px;
      margin: 30px auto;
      border: none;
      border-radius: 50%;
      background: #2768cc;
      color: white;
      font-size: 22px;
      font-weight: bold;
      touch-action: none;
      user-select: none;
    }

    #talkButton.active {
      background: #c0392b;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin: 20px;
    }

    .keyboard-hint {
        color: #777;
        font-size: 14px;
        margin-top: -15px;
    }

    kbd {
        display: inline-block;
        padding: 4px 9px;
        background: #f3f3f3;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-family: inherit;
        font-weight: bold;
    }

  </style>
</head>

<body>
    <h1>Bavarian Voice Assistant</h1>

    <p id="status">Disconnected</p>

    <button id="connectButton">Connect</button>
    <button id="disconnectButton" disabled>Disconnect</button>

    <button id="talkButton" disabled>
        Hold to talk
    </button>

    <p class="keyboard-hint">
        Hold <kbd>Space</kbd> or the button to talk
    </p>

    <div id="audio"></div>

    <script>
    // Replace with your existing Railway domain.
    const BACKEND_URL =
      "https://lehnerchatbotv03audio-production.up.railway.app";

    const status = document.getElementById("status");
    const connectButton =
      document.getElementById("connectButton");
    const disconnectButton =
      document.getElementById("disconnectButton");
    const talkButton =
      document.getElementById("talkButton");
    const audioContainer =
      document.getElementById("audio");

    let room = null;
    let pointerId = null;
    let spaceHeld = false;
    let turnQueue = Promise.resolve();

    function getAgentIdentity() {
      if (!room) return null;

      for (const participant of room.remoteParticipants.values()) {
        if (participant.isAgent) {
          return participant.identity;
        }
      }

      return null;
    }

    function updateStatus() {
      if (!room) return;

      const agentReady = !!getAgentIdentity();
      talkButton.disabled = !agentReady;

      status.textContent = agentReady
        ? "Connected — hold to talk"
        : "Waiting for agent...";
    }

    async function callAgent(method) {
      const identity = getAgentIdentity();

      if (!identity) {
        throw new Error("Agent not connected");
      }

      return room.localParticipant.performRpc({
        destinationIdentity: identity,
        method: method,
        payload: "",
      });
    }

    // Run button actions sequentially, even for quick taps.
    function queueAction(action) {
      turnQueue = turnQueue.then(action).catch(async (error) => {
        console.error(error);
        status.textContent = "Error: " + error.message;

        if (room) {
          await room.localParticipant
            .setMicrophoneEnabled(false)
            .catch(console.error);
          await callAgent("cancel_turn").catch(console.error);
        }
      });
    }

    // Connect to LiveKit
    connectButton.onclick = async () => {
      connectButton.disabled = true;
      status.textContent = "Connecting...";

      const newRoom = new LivekitClient.Room();

      try {
        const response = await fetch(
          BACKEND_URL + "/token"
        );

        if (!response.ok) {
          throw new Error("Could not get room token");
        }

        const data = await response.json();

        newRoom.on(
          LivekitClient.RoomEvent.TrackSubscribed,
          (track) => {
            if (track.kind === LivekitClient.Track.Kind.Audio) {
              audioContainer.appendChild(track.attach());
            }
          }
        );

        newRoom.on(
          LivekitClient.RoomEvent.TrackUnsubscribed,
          (track) => {
            track.detach().forEach(el => el.remove());
          }
        );

        newRoom.on(
          LivekitClient.RoomEvent.ParticipantConnected,
          updateStatus
        );

        newRoom.on(
          LivekitClient.RoomEvent.ParticipantDisconnected,
          updateStatus
        );

        newRoom.on(
          LivekitClient.RoomEvent.Disconnected,
          () => {
            room = null;
            pointerId = null;
            talkButton.classList.remove("active");
            talkButton.disabled = true;
            connectButton.disabled = false;
            disconnectButton.disabled = true;
            status.textContent = "Disconnected";
            audioContainer.innerHTML = "";
          }
        );

        await newRoom.connect(
          data.server_url,
          data.participant_token
        );

        room = newRoom;

        await room.startAudio();

        // Request mic permission once, then mute it.
        await room.localParticipant
          .setMicrophoneEnabled(true);
        await room.localParticipant
          .setMicrophoneEnabled(false);

        disconnectButton.disabled = false;
        updateStatus();

      } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;

        await newRoom.disconnect();
        room = null;
        connectButton.disabled = false;
      }
    };

    // Start speaking when button is pressed
    talkButton.addEventListener("pointerdown", (event) => {
        if (
            !room ||
            talkButton.disabled ||
            pointerId !== null ||
            spaceHeld
        ) {
            return;
        }

      event.preventDefault();
      pointerId = event.pointerId;
      talkButton.setPointerCapture(pointerId);
      talkButton.classList.add("active");

      queueAction(async () => {
        if (!room) return;

        await callAgent("start_turn");
        await room.localParticipant
          .setMicrophoneEnabled(true);

        status.textContent = "Listening...";
      });
    });

    // Finish speaking when button is released
    function releaseTalk(event, canceled = false) {
      if (pointerId !== event.pointerId) return;

      pointerId = null;
      talkButton.classList.remove("active");

      queueAction(async () => {
        if (!room) return;

        await room.localParticipant
          .setMicrophoneEnabled(false);

        await callAgent(
          canceled ? "cancel_turn" : "end_turn"
        );

        status.textContent = canceled
          ? "Recording canceled"
          : "Processing...";
      });
    }

    talkButton.addEventListener(
      "pointerup",
      event => releaseTalk(event)
    );

    talkButton.addEventListener(
      "pointercancel",
      event => releaseTalk(event, true)
    );

    // SPACEBAR: Start speaking
    document.addEventListener("keydown", (event) => {
        if (event.code !== "Space" || event.repeat) return;

        // Don't interfere with text input fields
        if (
            event.target.matches("input, textarea, select") ||
            event.target.isContentEditable
        ) return;

        if (
            !room ||
            talkButton.disabled ||
            spaceHeld ||
            pointerId !== null
        ) return;

        event.preventDefault(); // Prevent page scrolling

        spaceHeld = true;
        talkButton.classList.add("active");

        queueAction(async () => {
            if (!room) return;

            await callAgent("start_turn");

            await room.localParticipant
                .setMicrophoneEnabled(true);

            status.textContent = "Listening...";
        });
    });


    // SPACEBAR: Stop speaking
    document.addEventListener("keyup", (event) => {
        if (event.code !== "Space" || !spaceHeld) return;

        event.preventDefault();
        releaseSpace();
    });

    function releaseSpace(canceled = false) {
        if (!spaceHeld) return;

        spaceHeld = false;
        talkButton.classList.remove("active");

        queueAction(async () => {
            if (!room) return;

            await room.localParticipant
                .setMicrophoneEnabled(false);

            await callAgent(
                canceled ? "cancel_turn" : "end_turn"
            );

            status.textContent = canceled
                ? "Recording canceled"
                : "Processing...";
        });
    }

    // Cancel if the browser loses focus while Space is held
    window.addEventListener("blur", () => {
        releaseSpace(true);
    });


    // Avoid leaving the microphone active if focus is lost.
    window.addEventListener("blur", () => {
      if (pointerId !== null) {
        releaseTalk({ pointerId }, true);
      }
    });

    // Disconnect
    disconnectButton.onclick = async () => {
      disconnectButton.disabled = true;
      talkButton.disabled = true;

      if (pointerId !== null) {
        releaseTalk({ pointerId }, true);
      }

        releaseSpace(true);
        await turnQueue;

      if (room) {
        await room.disconnect();
        room = null;
      }

      audioContainer.innerHTML = "";
      status.textContent = "Disconnected";
      connectButton.disabled = false;
    };
    </script>
</body>
</html>
